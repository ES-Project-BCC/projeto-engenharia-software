server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redireciona qualquer rota para o index.html (necessario para o roteamento do Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para assets estaticos (js, css, imagens)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
