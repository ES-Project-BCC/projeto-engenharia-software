<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Bem-vindo de volta</h2>
      <p>Faça login para acessar sua conta</p>
    </div>
    
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="loginData.email" 
          required 
          placeholder="seu@email.com"
          #email="ngModel">
        <div class="error-message" *ngIf="email.invalid && (email.dirty || email.touched)">
          Por favor, insira um e-mail válido.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="loginData.password" 
          required 
          placeholder="Sua senha"
          #password="ngModel">
        <div class="error-message" *ngIf="password.invalid && (password.dirty || password.touched)">
          A senha é obrigatória.
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
        Entrar
      </button>
      
      <div class="auth-footer">
        <p>Não tem uma conta? <a routerLink="/registro">Registre-se aqui</a></p>
      </div>
    </form>
  </div>
</div>
