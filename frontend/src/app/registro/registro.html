<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Criar Conta</h2>
      <p>Preencha os dados para se registrar</p>
    </div>
    
    <form (ngSubmit)="onSubmit()" #registroForm="ngForm" class="auth-form">
      
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input 
          type="text" 
          id="nome" 
          name="nome" 
          [(ngModel)]="registroData.nome" 
          required 
          placeholder="Seu nome completo"
          #nome="ngModel">
        <div class="error-message" *ngIf="nome.invalid && (nome.dirty || nome.touched)">
          O nome é obrigatório.
        </div>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="registroData.email" 
          required 
          placeholder="seu@email.com"
          #email="ngModel">
        <div class="error-message" *ngIf="email.invalid && (email.dirty || email.touched)">
          Por favor, insira um e-mail válido.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="registroData.password" 
          required 
          placeholder="Sua senha"
          minlength="6"
          #password="ngModel">
        <div class="error-message" *ngIf="password.invalid && (password.dirty || password.touched)">
          A senha deve ter no mínimo 6 caracteres.
        </div>
      </div>

      <div class="form-group">
        <label for="role">Perfil de Acesso</label>
        <select 
          id="role" 
          name="role" 
          [(ngModel)]="registroData.role" 
          required>
          <option value="USER">Usuário (USER)</option>
          <option value="ADMIN">Administrador (ADMIN)</option>
        </select>
      </div>

      <button type="submit" class="btn-primary" [disabled]="registroForm.invalid">
        Registrar
      </button>
      
      <div class="auth-footer">
        <p>Já tem uma conta? <a routerLink="/login">Faça login</a></p>
      </div>
    </form>
  </div>
</div>
