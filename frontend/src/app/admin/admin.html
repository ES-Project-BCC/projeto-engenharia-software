<div class="admin-container">
  <div class="admin-card">
    <div class="admin-header">
      <div class="badge-admin">ADMIN</div>
      <h1>Painel Administrativo</h1>
      <p class="subtitle">Bem-vindo, <strong>{{ userEmail }}</strong></p>
    </div>

    <div class="admin-body">
      <a routerLink="/cadastro-recurso" class="btn-action">📦 Cadastrar Novo Recurso</a>
      <a routerLink="/bloquear-recurso" class="btn-action">🔒 Bloquear Recurso</a>
    </div>

    <div class="admin-footer">
      <a routerLink="/home" class="btn-secondary">← Voltar para Home</a>
      <button class="btn-logout" (click)="logout()">Sair</button>
    </div>
  </div>
</div>
