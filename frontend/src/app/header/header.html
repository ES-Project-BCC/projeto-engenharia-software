<header class="app-header" *ngIf="authService.isAuthenticated()">
  <div class="logo">
    <a routerLink="/home">SGR</a>
  </div>
  <div class="header-actions">
    <div class="notification-wrapper">
      <button class="btn-bell" (click)="toggleDropdown()">
        🔔
        <span class="badge" *ngIf="naoLidasCount > 0">{{ naoLidasCount > 99 ? '99+' : naoLidasCount }}</span>
      </button>

      <div class="notification-dropdown" *ngIf="dropdownOpen">
        <div class="dropdown-header">
          <h3>Notificações</h3>
        </div>
        <div class="dropdown-body">
          <div *ngIf="notificacoesRecentes.length === 0" class="no-notifications">
            Nenhuma notificação.
          </div>
          <div *ngFor="let notif of notificacoesRecentes" 
               class="notification-item" 
               [class.unread]="!notif.lida"
               (click)="marcarComoLida(notif, $event)">
            <p>{{ notif.mensagem }}</p>
            <span class="time">{{ notif.criadaEm | date:'short' }}</span>
          </div>
        </div>
        <div class="dropdown-footer">
          <button (click)="verTodas()">Ver todas as notificações</button>
        </div>
      </div>
    </div>
  </div>
</header>
