# Configuracoes do projeto no SonarCloud
# Acesse: https://sonarcloud.io/projects/create para criar o projeto
# e copie o "projectKey" e "organization" gerados la

# Identificador unico do projeto no SonarCloud (voce cria no site)
sonar.projectKey=ES-Project-BCC_projeto-engenharia-software
sonar.organization=es-project-bcc

sonar.projectName=Reserva de Laboratorios - UFAPE
sonar.projectVersion=1.0

# Onde fica o codigo do backend
sonar.sources=backend/src/main/java
sonar.tests=backend/src/test/java

# Apontar para o relatorio do JaCoCo para o Sonar calcular a cobertura
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Excluir arquivos que nao precisam ser analisados
sonar.exclusions=**/dto/**,**/config/**,**/*Application.java
