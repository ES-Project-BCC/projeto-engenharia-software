# Configuracoes de producao - PostgreSQL no Render
# Os valores vem de variaveis de ambiente definidas no painel do Render
# Nunca coloque senhas reais aqui no codigo!
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Atualiza o banco sem destruir os dados existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# Chave JWT vem de variavel de ambiente - obrigatorio configurar no Render!
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Menos verbosidade em producao
logging.level.org.springframework.security=WARN
logging.level.root=INFO
