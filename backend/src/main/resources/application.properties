spring.application.name=backend

# Banco H2 em memoria (dados somem a cada restart - ok para desenvolvimento)
spring.datasource.url=jdbc:h2:mem:backenddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2, disponivel em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Cria/atualiza as tabelas automaticamente a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Chave secreta usada para assinar os tokens JWT (HS256 exige pelo menos 256 bits / 32 caracteres)
# IMPORTANTE: em producao isso deve vir de uma variavel de ambiente, nunca ficar hardcoded no repositorio
jwt.secret=troque-esta-chave-por-uma-bem-longa-e-aleatoria-antes-de-ir-para-producao
# Tempo de expiracao do token em milissegundos (aqui: 24 horas)
jwt.expiration=86400000

