# Configuracoes de teste - banco H2 em memoria, isolado do banco principal
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Recria o banco do zero a cada execucao de teste, garantindo isolamento
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Chave JWT de mentira so pra testes (nao usar em producao!)
jwt.secret=chave-de-teste-fake-so-para-os-testes-automatizados-nao-usar-em-producao
jwt.expiration=86400000

# Sem logs de seguranca nos testes, fica mais limpo
logging.level.org.springframework.security=WARN
